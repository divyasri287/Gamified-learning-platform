<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Dashboard</title>
  <link rel="stylesheet" href="teacher-dashboard.css" />
</head>
<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">Smart Shikha</h2>
    <ul>
      <li class="active">Dashboard</li>
      <li>Students</li>
      <li>Content</li>
      <li>Assignments</li>
      <li>Gamification</li>
      <li>Analytics</li>
      <li>Announcements</li>
      <li>Settings</li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="main">
    
    <!-- Top bar -->
    <div class="topbar">
      <h2>Teacher Dashboard</h2>
      <div class="profile">
        <img src="https://i.pravatar.cc/40" />
        <span>Ms. Sharma</span>
      </div>
    </div>

    <!-- Stats cards -->
    <div class="cards">
      <div class="card">
        <h3>Total Students</h3>
        <p>250</p>
      </div>
      <div class="card">
        <h3>Active Students</h3>
        <p>190</p>
      </div>
      <div class="card">
        <h3>Average Score</h3>
        <p>82.5%</p>
      </div>
    </div>

    <!-- Charts section -->
    <div class="charts">
      <div class="chart">
        <h3>Student Progress</h3>
        <div class="chart-box">Line Chart</div>
      </div>
      <div class="chart">
        <h3>Subject Performance</h3>
        <div class="chart-box">Bar Chart</div>
      </div>
    </div>

  </main>
</div>

</body>
</html>
