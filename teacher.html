<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>📘 TeachPlay</h2>
    <ul>
      <li class="active">Dashboard</li>
      <li>Students</li>
      <li>Assignments</li>
      <li>Analytics</li>
      <li>Logout</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <h1>Welcome, Teacher 👋</h1>

    <!-- Stats -->
    <div class="cards">
      <div class="card">
        <h3>Total Students</h3>
        <p>42</p>
      </div>
      <div class="card">
        <h3>Active Courses</h3>
        <p>6</p>
      </div>
      <div class="card">
        <h3>Pending Reviews</h3>
        <p>4</p>
      </div>
    </div>

    <!-- Students Table -->
    <section class="section">
      <h2>Student List</h2>
      <table>
        <tr>
          <th>Name</th>
          <th>Level</th>
          <th>Status</th>
        </tr>
        <tr>
          <td>Arun</td>
          <td>Level 3</td>
          <td>Active</td>
        </tr>
        <tr>
          <td>Divya</td>
          <td>Level 5</td>
          <td>Active</td>
        </tr>
      </table>
    </section>
  </main>

</div>

</body>
</html>
