<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>🎮 LearnPlay</h2>
    <ul>
      <li class="active">Dashboard</li>
      <li>My Courses</li>
      <li>Achievements</li>
      <li>Leaderboard</li>
      <li>Logout</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <h1>Welcome, Student 👋</h1>

    <!-- Stats -->
    <div class="cards">
      <div class="card">
        <h3>XP Points</h3>
        <p>1200</p>
      </div>
      <div class="card">
        <h3>Completed Levels</h3>
        <p>8</p>
      </div>
      <div class="card">
        <h3>Badges</h3>
        <p>5</p>
      </div>
    </div>

    <!-- Courses -->
    <section class="section">
      <h2>My Courses</h2>
      <div class="course-list">
        <div class="course">Maths Quest</div>
        <div class="course">Science Lab</div>
        <div class="course">Coding Basics</div>
      </div>
    </section>
  </main>

</div>

</body>
</html>
