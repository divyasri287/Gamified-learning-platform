<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">✓</div>
      <div>
        <h1>TaskFlow</h1>
        <p>Organize your day like a pro</p>
      </div>
    </div>

    <button id="themeToggle" class="theme-btn">🌙</button>
  </header>

  <main class="auth-wrap">
    <div class="card auth-card">
      <h2>Create Account</h2>
      <p class="sub">Create your own email & password</p>

      <form id="registerForm" class="form">
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="Enter your email" required />

        <label>Password</label>
        <input id="regPassword" type="password" placeholder="Create password" required />

        <label>Confirm Password</label>
        <input id="regConfirm" type="password" placeholder="Confirm password" required />

        <button class="primary-btn" type="submit">Create Account</button>

      </form>

      <p class="link-text">
        Already have an account?
        <a href="index.html">Login</a>
      </p>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
